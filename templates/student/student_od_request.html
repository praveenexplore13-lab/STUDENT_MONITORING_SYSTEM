<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OD Request - Student</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}">
    <!-- Dark Mode CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">
</head>
<body>
    <div class="student-container">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-user-graduate"></i>
                <span>Student Panel</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="{{ url_for('student.student_dashboard') }}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="{{ url_for('student.student_profile') }}"><i class="fas fa-user"></i> Profile</a></li>
                <li><a href="{{ url_for('student.student_edit_profile') }}"><i class="fas fa-edit"></i> Edit Profile</a></li>
                <li><a href="{{ url_for('student.student_notes') }}"><i class="fas fa-sticky-note"></i> Mentor Notes</a></li>
                <li><a href="{{ url_for('student.student_notifications') }}"><i class="fas fa-bell"></i> Notifications</a></li>
                <li class="active"><a href="{{ url_for('student.student_od_request') }}"><i class="fas fa-calendar-plus"></i> OD Request</a></li>
                <li><a href="{{ url_for('student.student_od_status') }}"><i class="fas fa-history"></i> OD Status</a></li>
                <li><a href="{{ url_for('chat.student_chat') }}"><i class="fas fa-robot"></i> AI Chatbot</a></li>
                <li><a href="{{ url_for('auth.logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left"><h1>OD Request</h1></div>
                <div class="header-right"><span><i class="fas fa-user"></i> {{ name }}</span></div>
            </header>

            <div class="card">
                <div class="card-header"><h2><i class="fas fa-calendar-plus"></i> Submit OD Request</h2></div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="form-group">
                            <label><i class="fas fa-heading"></i> Title</label>
                            <input type="text" name="title" placeholder="Enter OD title (e.g., Hackathon 2026)" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-comment"></i> Description</label>
                            <textarea name="description" rows="4" placeholder="Describe why you need OD permission..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-calendar"></i> OD Date</label>
                            <input type="date" name="od_date" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-image"></i> Upload Proof (Optional)</label>
                            <input type="file" name="proof_image" accept="image/*,.pdf,.doc,.docx">
                            <small>Upload registration proof, certificate, or any supporting document.</small>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i> Submit Request</button>
                            <a href="{{ url_for('student.student_dashboard') }}" class="btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Chat Bubble -->
    {% include 'chat_bubble.html' %}

    <!-- Theme Toggle Script -->
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>

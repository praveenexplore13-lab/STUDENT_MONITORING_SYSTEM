<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mentor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">
</head>
<body>
    <div class="mentor-container">
        <nav class="sidebar">
            <div class="sidebar-brand"><i class="fas fa-chalkboard-teacher"></i><span>Mentor Panel</span></div>
            <ul class="sidebar-menu">
                <li><a href="{{ url_for('mentor.mentor_dashboard') }}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="{{ url_for('mentor.mentor_students') }}"><i class="fas fa-users"></i> Students</a></li>
                <li><a href="{{ url_for('mentor.mentor_notifications') }}"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="{{ url_for('mentor.mentor_od_requests') }}"><i class="fas fa-calendar-check"></i> OD Requests</a></li>
                <li><a href="{{ url_for('attendance_otp.mentor_attendance') }}"><i class="fas fa-qrcode"></i> Attendance</a></li>
                <li><a href="{{ url_for('attendance.mentor_engagement') }}"><i class="fas fa-chart-line"></i> Engagement</a></li>
                <li class="active"><a href="{{ url_for('mentor.mentor_profile') }}"><i class="fas fa-user-cog"></i> Profile</a></li>
                <li><a href="{{ url_for('chat.mentor_chat') }}"><i class="fas fa-robot"></i> AI Chatbot</a></li>
                <li><a href="{{ url_for('auth.logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left"><h1>My Profile</h1></div>
                <div class="header-right"><span><i class="fas fa-user"></i> {{ name }}</span></div>
            </header>

            <div class="profile-card">
                <div class="profile-avatar-large"><i class="fas fa-chalkboard-teacher"></i></div>
                <h2>{{ name }}</h2>
                <p><i class="fas fa-envelope"></i> {{ email }}</p>
                <p><i class="fas fa-user-tag"></i> Faculty Mentor</p>
                <div class="profile-stats">
                    <div class="stat-item"><h3>📚</h3><p>Mentor</p></div>
                    <div class="stat-item"><h3>✏️</h3><p>Edit Access</p></div>
                    <div class="stat-item"><h3>📝</h3><p>Add Notes</p></div>
                </div>
            </div>
        </main>
    </div>

    {% include 'chat_bubble.html' %}
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>

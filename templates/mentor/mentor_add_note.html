<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Note - Mentor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mentor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">
</head>
<body>
    <div class="mentor-container">
        <nav class="sidebar">
            <div class="sidebar-brand"><i class="fas fa-chalkboard-teacher"></i><span>Mentor Panel</span></div>
            <ul class="sidebar-menu">
                <li><a href="{{ url_for('mentor.mentor_dashboard') }}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li class="active"><a href="{{ url_for('mentor.mentor_students') }}"><i class="fas fa-users"></i> Students</a></li>
                <li><a href="{{ url_for('mentor.mentor_notifications') }}"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="{{ url_for('mentor.mentor_od_requests') }}"><i class="fas fa-calendar-check"></i> OD Requests</a></li>
                <li><a href="{{ url_for('attendance_otp.mentor_attendance') }}"><i class="fas fa-qrcode"></i> Attendance</a>`n                <li><a href="{{ url_for('attendance_otp.mentor_attendance_history') }}"><i class="fas fa-history"></i> History</a></li></li>
                
                <li><a href="{{ url_for('mentor.mentor_profile') }}"><i class="fas fa-user-cog"></i> Profile</a></li>
                <li><a href="{{ url_for('chat.mentor_chat') }}"><i class="fas fa-robot"></i> AI Chatbot</a></li>
                <li><a href="{{ url_for('auth.logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left"><h1>Add Counseling Note</h1></div>
                <div class="header-right"><span><i class="fas fa-user"></i> {{ name }}</span></div>
            </header>

            <div class="card">
                <div class="card-header"><h2>📝 Note for {{ student.name }}</h2></div>
                <div class="card-body">
                    <form method="POST">
                        <div class="form-group"><label><i class="fas fa-calendar"></i> Date</label><input type="date" name="note_date" value="{{ today }}"></div>
                        <div class="form-group"><label><i class="fas fa-comment"></i> Counseling Note</label><textarea name="note" rows="6" placeholder="Write your counseling notes here..." required></textarea></div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save Note</button>
                            <a href="{{ url_for('mentor.mentor_student_detail', student_id=student.id) }}" class="btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    {% include 'chat_bubble.html' %}
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>

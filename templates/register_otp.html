<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #bg-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
    .video-overlay { position: fixed; inset: 0; background: rgba(4, 8, 25, 0.45); z-index: -1; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 450px; position: relative; z-index: 1; }
    .auth-card { background: rgba(10, 15, 40, 0.72); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.22); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 35px rgba(99, 102, 241, 0.25); animation: slideUp 0.5s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-header h1 { color: white; font-size: 28px; margin-bottom: 8px; text-shadow: 0 0 15px rgba(165, 180, 252, 0.7); }
    .auth-header h1 i { color: #a5b4fc; }
    .auth-header p { color: #cbd5e1; font-size: 14px; }
    .auth-header strong { color: #a5b4fc; }
    .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; font-weight: 500; animation: slideDown 0.3s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .alert-success { background: rgba(16, 185, 129, 0.2); color: #a7f3d0; border-left: 4px solid #10b981; }
    .alert-error { background: rgba(239, 68, 68, 0.2); color: #fecaca; border-left: 4px solid #ef4444; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 6px; color: #e2e8f0; font-weight: 600; font-size: 14px; }
    .form-group label i { color: #a5b4fc; width: 20px; }
    .form-group input { width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.10); color: white; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 10px; text-align: center; letter-spacing: 8px; font-size: 24px; font-weight: bold; transition: all 0.3s; }
    .form-group input:focus { outline: none; border-color: #818cf8; background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.20), 0 0 20px rgba(99, 102, 241, 0.25); }
    .otp-timer { margin-top: 10px; padding: 10px; background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; text-align: center; color: #cbd5e1; font-weight: 600; }
    .otp-timer span { color: #a5b4fc; font-size: 18px; }
    .otp-timer .expired { color: #f87171; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4); }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(99, 102, 241, 0.6), 0 0 20px rgba(139, 92, 246, 0.4); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .auth-footer { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.15); }
    .auth-footer p { color: #cbd5e1; font-size: 14px; }
    .auth-footer a { color: #a5b4fc; text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { color: white; text-shadow: 0 0 10px #818cf8; }
    @media (max-width: 600px) { .auth-card { padding: 25px; } .auth-header h1 { font-size: 24px; } .form-group input { font-size: 20px; letter-spacing: 5px; } }
</style>
</head>
<body>
<video autoplay muted loop playsinline id="bg-video">
    <source src="{{ url_for('static', filename='video/anime-bg.mp4') }}" type="video/mp4">
</video>
<div class="video-overlay"></div>

<div class="container">
    <div class="auth-card">
        <div class="auth-header">
            <h1><i class="fas fa-shield-alt"></i> Verify OTP</h1>
            <p>Enter the OTP sent to <strong>{{ email }}</strong></p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.verify_register') }}" id="otpForm">
            <div class="form-group">
                <label for="otp"><i class="fas fa-key"></i> Enter OTP</label>
                <input type="text" id="otp" name="otp" placeholder="000000" maxlength="6" required autocomplete="off">
                <div class="otp-timer">
                    <i class="fas fa-clock"></i> OTP expires in: <span id="timer">05:00</span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="verifyBtn">
                <i class="fas fa-check-circle"></i> Verify OTP
            </button>
        </form>

        <div class="auth-footer">
            <p>Didn't receive OTP? <a href="{{ url_for('auth.register') }}">Resend OTP</a></p>
            <p><a href="{{ url_for('auth.login') }}"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const otpInput = document.getElementById('otp');
        const form = document.getElementById('otpForm');
        const verifyBtn = document.getElementById('verifyBtn');

        otpInput.focus();

        otpInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
        });

        otpInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                form.submit();
            }
        });

        let timeLeft = 300;
        const timerElement = document.getElementById('timer');

        const timerInterval = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            timeLeft--;

            if (timeLeft < 0) {
                clearInterval(timerInterval);
                timerElement.textContent = 'Expired!';
                timerElement.className = 'expired';
                otpInput.disabled = true;
                verifyBtn.disabled = true;
                verifyBtn.innerHTML = '<i class="fas fa-times-circle"></i> OTP Expired';
            }
        }, 1000);

        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            setTimeout(() => {
                alert.style.opacity = '0';
                alert.style.transition = 'opacity 0.5s';
                setTimeout(() => {
                    alert.remove();
                }, 500);
            }, 5000);
        });
    });
</script>
</body>
</html>

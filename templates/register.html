<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - OTP System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #bg-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
    .video-overlay { position: fixed; inset: 0; background: rgba(4, 8, 25, 0.45); z-index: -1; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 450px; position: relative; z-index: 1; }
    .auth-card { background: rgba(10, 15, 40, 0.72); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.22); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 35px rgba(99, 102, 241, 0.25); animation: slideUp 0.5s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-header h1 { color: white; font-size: 28px; margin-bottom: 8px; text-shadow: 0 0 15px rgba(165, 180, 252, 0.7); }
    .auth-header h1 i { color: #a5b4fc; }
    .auth-header p { color: #cbd5e1; font-size: 14px; }
    .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; font-weight: 500; animation: slideDown 0.3s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .alert-success { background: rgba(16, 185, 129, 0.2); color: #a7f3d0; border-left: 4px solid #10b981; }
    .alert-error { background: rgba(239, 68, 68, 0.2); color: #fecaca; border-left: 4px solid #ef4444; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 6px; color: #e2e8f0; font-weight: 600; font-size: 14px; }
    .form-group label i { color: #a5b4fc; width: 20px; }
    .form-group input { width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.10); color: white; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 10px; font-size: 15px; transition: all 0.3s; }
    .form-group input:focus { outline: none; border-color: #818cf8; background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.20), 0 0 20px rgba(99, 102, 241, 0.25); }
    .password-strength { margin-top: 5px; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; color: #cbd5e1; background: rgba(255, 255, 255, 0.08); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4); }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(99, 102, 241, 0.6), 0 0 20px rgba(139, 92, 246, 0.4); }
    .auth-footer { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.15); }
    .auth-footer p { color: #cbd5e1; font-size: 14px; }
    .auth-footer a { color: #a5b4fc; text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { color: white; text-shadow: 0 0 10px #818cf8; }
    @media (max-width: 600px) { .auth-card { padding: 25px; } .auth-header h1 { font-size: 24px; } }
</style>
</head>
<body>
<video autoplay muted loop playsinline id="bg-video">
    <source src="{{ url_for('static', filename='video/anime-bg.mp4') }}" type="video/mp4">
</video>
<div class="video-overlay"></div>

<div class="container">
    <div class="auth-card">
        <div class="auth-header">
            <h1><i class="fas fa-user-plus"></i> Create Account</h1>
            <p>Register with OTP verification</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
            <div class="form-group">
                <label for="name"><i class="fas fa-user"></i> Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password (min 6 characters)" required>
                <div id="passwordStrength"></div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-paper-plane"></i> Register & Send OTP
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login Here</a></p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('password');
        const strengthDiv = document.getElementById('passwordStrength');

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strength = getPasswordStrength(password);
            
            if (password.length > 0) {
                strengthDiv.innerHTML = `
                    <div class="password-strength" style="background: ${strength.color}; color: white;">
                        ${strength.label}
                    </div>
                `;
            } else {
                strengthDiv.innerHTML = '';
            }
        });

        function getPasswordStrength(password) {
            let score = 0;
            let label = '';
            let color = '';

            if (password.length >= 6) score++;
            if (password.length >= 10) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) score++;

            switch (score) {
                case 0: case 1: label = 'Weak Password'; color = '#ef4444'; break;
                case 2: label = 'Fair Password'; color = '#f59e0b'; break;
                case 3: label = 'Good Password'; color = '#3b82f6'; break;
                case 4: label = 'Strong Password'; color = '#22c55e'; break;
                case 5: label = 'Very Strong Password'; color = '#059669'; break;
                default: label = 'Weak Password'; color = '#ef4444';
            }

            return { label, color };
        }

        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            setTimeout(() => {
                alert.style.opacity = '0';
                alert.style.transition = 'opacity 0.5s';
                setTimeout(() => {
                    alert.remove();
                }, 500);
            }, 5000);
        });
    });
</script>
</body>
</html>
